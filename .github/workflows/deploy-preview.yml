name: Deploy Preview

on:
  push:
    branches:
      - ci/linux-validation-on-main
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: Type PREVIEW to deploy only to kynova-os-preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kynova-os-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_preview == 'PREVIEW') || (github.event_name == 'push' && github.event.head_commit.message == 'chore: deploy Preview once [deploy-preview]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Confirm Preview credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Build and deploy Preview Worker
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: 9fd7965b39eb86ef8b2eaf126350f191
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
